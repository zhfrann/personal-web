name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run validate # npm run check && npm run build, make sure application builds successfully

      - name: Validate Docker image
        run: docker build -t personal-web:ci . # make sure Docker image builds successfully

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest

    needs:
      - validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs:
      - publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://zhafranilham.my.id

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
            set -euo pipefail

            cd "$HOME/apps/personal-web"

            git fetch origin main
            git reset --hard origin/main

            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env

            docker compose pull
            docker compose up -d --remove-orphans

            healthy=0

            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error \
                http://127.0.0.1:8080/ > /dev/null; then
                echo "Application is healthy."
                healthy=1
                break
              fi

              echo "Waiting for application... ($attempt/10)"
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Application failed health check."
              docker compose ps
              docker compose logs --tail=50
              exit 1
            fi

            docker image prune -f
          REMOTE
